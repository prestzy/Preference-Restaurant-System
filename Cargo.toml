[package]
name = "fyp_recommender"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Explainable QR restaurant ordering and recommendation prototype for limited-data SME restaurants"
repository = "https://github.com/prestzy/Preference-Restaurant-System"

[dependencies]
anyhow = "1.0"
axum = "0.7"
csv = "1.3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread", "net"] }
tower-http = { version = "0.5", features = ["fs"] }
